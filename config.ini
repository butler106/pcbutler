[ADMIN]
password = butleradmin

[PATHS]
# 플러그인 로드 경로
plugin_dir = ../plugins
# 보고서 저장 기본 경로. BASE_DIR (프로젝트 폴더) 바로 아래 'reports' 폴더에 저장됩니다.
report_dir = reports

[PLUGINS]
user_plugins =
    ; 1. 핵심 진단 플러그인
    plugin_osinfo.py
    plugin_ramstress.py
    plugin_patchstatus.py
    plugin_diskcheck.py  
    
    ; 2. 보고서 생성 파이프라인 (순서 필수)
    plugin_stat_summary.py   
    plugin_reportmerge.py    
    plugin_pdfexport.py      

[REPORT_SETTINGS]
# 'ko' (한국어) 또는 'en' (영어) 중 하나로 설정
REPORT_LANGUAGE = ko

[EMAIL_SETTINGS]
# 보고서 전송에 사용될 SMTP 설정

[MESSAGES_KO]
REPORT_TITLE = PCButler 시스템 요약 보고서
REPORT_GENERATED_DATE = 생성일
REPORT_SYSTEM_INFO = 시스템 정보
REPORT_SECURITY_STATUS = 보안 상태
REPORT_QUARANTINE_WARNING_TITLE = 🚨 보안 경고 🚨
REPORT_QUARANTINE_WARNING_MSG1 = 최근 의심 파일이 감지되어 격리되었습니다.
REPORT_QUARANTINE_WARNING_MSG2 = 시스템의 추가적인 위협을 확인하기 위해 **전체 시스템 검사를 즉시** 실행할 것을 강력히 권장합니다.
REPORT_QUARANTINE_WARNING_MSG3 = 자세한 내용은 'quarantine_log.json' 파일을 참조하십시오.
REPORT_NO_QUARANTINE_MSG = 현재 격리된 파일로 인한 추가 시스템 검사 권고 사항은 없습니다.
REPORT_PLUGIN_SUMMARY = 플러그인 실행 요약

[MESSAGES_EN]
REPORT_TITLE = PCButler System Summary Report
REPORT_GENERATED_DATE = Generated Date
REPORT_SYSTEM_INFO = System Information
REPORT_SECURITY_STATUS = Security Status
REPORT_QUARANTINE_WARNING_TITLE = 🚨 Security Warning 🚨
REPORT_QUARANTINE_WARNING_MSG1 = Recent suspicious files have been detected and quarantined.
REPORT_QUARANTINE_WARNING_MSG2 = We strongly recommend running a **full system scan immediately** to check for additional threats.
REPORT_QUARANTINE_WARNING_MSG3 = Please refer to 'quarantine_log.json' for details.
REPORT_NO_QUARANTINE_MSG = There are no additional system scan recommendations due to quarantined files.
REPORT_PLUGIN_SUMMARY = Plugin Execution Summary