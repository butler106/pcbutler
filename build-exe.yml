name: Build PC Butler Windows exe

# 웹에서 파일을 올리기만 하면(또는 push하면) GitHub의 무료 Windows 빌드 서버에서
# 자동으로 이 워크플로가 실행되어 exe를 만들어준다. 사용자 PC에서는
# 아무 명령어도 입력할 필요가 없다 - 빌드가 끝나면 "Actions" 탭에서
# 결과물(zip)을 다운로드하면 된다.
on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}   # Actions 탭에서 "Run workflow" 버튼으로 수동 실행도 가능

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm pcbutler_gui.spec

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pcbutler-windows-build
          path: dist/pcbutler/
